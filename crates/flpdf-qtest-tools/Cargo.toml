[package]
name = "flpdf-qtest-tools"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Rust ports of qpdf's test-harness helper binaries, for the flpdf-qtest harness."

# The binary name is what the flpdf-qtest harness consumes: its
# shim/qpdf-test-compare execs target/release/flpdf-test-compare via
# FLPDF_TEST_COMPARE_BIN. Renaming the package must not rename the binary.
[[bin]]
name = "flpdf-test-compare"
path = "src/main.rs"

[[bin]]
name = "qpdfjob-ctest"
path = "src/bin/qpdfjob_ctest.rs"

[[bin]]
name = "qpdf-ctest"
path = "src/bin/qpdf_ctest.rs"

[[bin]]
name = "flpdf-test-driver"
path = "src/bin/driver.rs"

[[bin]]
name = "flpdf-test-pdf-doc-encoding"
path = "src/bin/pdf_doc_encoding.rs"

[[bin]]
name = "flpdf-test-pdf-unicode"
path = "src/bin/pdf_unicode.rs"

[[bin]]
name = "flpdf-test-unicode-filenames"
path = "src/bin/unicode_filenames.rs"

[[bin]]
name = "flpdf-test-tokenizer"
path = "src/bin/tokenizer.rs"

[[bin]]
name = "test_xref"
path = "src/bin/test_xref.rs"

[[bin]]
name = "test_parsedoffset"
path = "src/bin/test_parsedoffset.rs"

[[bin]]
name = "flpdf-test-large-file"
path = "src/bin/test_large_file.rs"

[[bin]]
name = "pdf_from_scratch"
path = "src/bin/pdf_from_scratch.rs"

[[bin]]
name = "test_many_nulls"
path = "src/bin/test_many_nulls.rs"

[lib]
name = "flpdf_qtest_tools"
path = "src/lib.rs"

[features]
default = []
qpdf-zlib-compat = ["flpdf/qpdf-zlib-compat"]
qpdf-libjpeg-compat = ["flpdf/qpdf-libjpeg-compat"]

[dependencies]
flpdf = { path = "../flpdf", features = ["qtest-driver"] }
libc.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
flate2.workspace = true
predicates.workspace = true
tempfile.workspace = true
