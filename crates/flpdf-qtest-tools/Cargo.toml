[package]
name = "flpdf-qtest-tools"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Rust ports of qpdf's test-harness helper binaries, for the flpdf-qtest harness."

# The binary name is what the flpdf-qtest harness consumes: its
# shim/qpdf-test-compare execs target/release/flpdf-test-compare via
# FLPDF_TEST_COMPARE_BIN. Renaming the package must not rename the binary.
[[bin]]
name = "flpdf-test-compare"
path = "src/main.rs"

[[bin]]
name = "flpdf-test-driver"
path = "src/bin/driver.rs"

[lib]
name = "flpdf_qtest_tools"
path = "src/lib.rs"

[features]
default = []
qpdf-zlib-compat = ["flpdf/qpdf-zlib-compat"]

[dependencies]
flpdf = { path = "../flpdf" }
libc.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
flate2.workspace = true
predicates.workspace = true
tempfile.workspace = true
