name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # qpdf behavior is an oracle for compatibility tests. Keep this in sync with
  # scripts/fetch-qpdf-source.sh and the pinned source in the module docs.
  QPDF_VERSION: 11.9.0

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Test qpdf module correspondence checker
        run: python3 -m unittest scripts/tests/test_qpdf_module_docs.py

      - name: Check qpdf module correspondence
        run: python3 scripts/qpdf-module-docs.py --check

      - name: Test qpdf JSON input correspondence contract
        run: python3 -m unittest scripts/tests/test_json_input_correspondence.py

      - name: Test qpdf-deviation marker checker
        run: python3 -m unittest scripts/tests/test_qpdf_deviation_markers.py

      - name: Check qpdf-deviation markers
        run: python3 scripts/check-qpdf-deviation-markers.py --check

      - name: Test patch-coverage gate contract
        run: bash scripts/tests/patch-coverage-contract.sh

      - name: Install libjpeg development headers (Linux)
        run: bash scripts/ci-apt-install.sh libjpeg-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # flpdf is published to docs.rs, so broken intra-doc links are a quality
      # regression. --document-private-items is required: these breaks can live
      # entirely on pub(crate)/private items while the public docs.rs build
      # stays clean, so without it the gate misses private-only rot. Named
      # rustdoc lints (not `-D warnings`) keep the gate stable across stable-
      # toolchain bumps — same rationale as the fuzz job pinning its nightly.
      - name: Doc links
        run: RUSTDOCFLAGS="-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links -D rustdoc::invalid_html_tags" cargo doc --workspace --no-deps --document-private-items

  test:
    name: Test (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Platform parity with fulgur's `test` matrix so flpdf surfaces the
      # same cross-arch / cross-OS behaviour ahead of fulgur integration.
      # Coverage lives in its own `coverage` job (below) so the elevated
      # id-token: write permission Codecov OIDC needs stays off these
      # cross-platform cells (the job inherits workflow contents: read only).
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            cache-key: ubuntu-latest-flpdf
          - os: ubuntu-24.04-arm
            arch: arm64
            cache-key: ubuntu-24.04-arm-flpdf
          - os: macos-latest
            arch: arm64
            cache-key: macos-latest-flpdf
          - os: windows-latest
            arch: amd64
            cache-key: windows-latest-flpdf

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.97.1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3
        with:
          shared-key: ${{ matrix.cache-key }}

      # qpdf is an external oracle for the cross-check suites (cli_linearize_qpdf,
      # cli_qdf*, cli_object_streams_qpdf_parity, writer_tests, ...). It must
      # be 11.9.0, matching scripts/fetch-qpdf-source.sh, rather than whichever
      # version happens to be current in Homebrew or Chocolatey.
      - name: Install qpdf 11.9.0 (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/ci-apt-install.sh qpdf

      # The qpdf executable is statically linked to libqpdf but still needs
      # these Homebrew-provided runtime libraries. Keep them outside the cache
      # so the cached executable runs against the runner's current libraries.
      - name: Install qpdf runtime libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install jpeg-turbo openssl@3 zlib

      # qpdf 11.9.0 has no macOS release binary. The build below takes about
      # three minutes, so cache its verified installed output. The key includes
      # the qpdf version, architecture, and static/OpenSSL build contract.
      - name: Restore qpdf 11.9.0 (macOS)
        id: qpdf-cache
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/qpdf-${{ env.QPDF_VERSION }}-install
          key: qpdf-${{ runner.os }}-${{ runner.arch }}-${{ env.QPDF_VERSION }}-static-openssl-v1

      # qpdf 11.9.0 has no macOS release binary. Build the verified upstream
      # source archive with the same OpenSSL-backed crypto configuration that
      # its distributed binaries use when the installed output was not cached.
      - name: Build qpdf 11.9.0 (macOS)
        if: runner.os == 'macOS' && steps.qpdf-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          release_url="https://github.com/qpdf/qpdf/releases/download/v${QPDF_VERSION}"
          archive="${RUNNER_TEMP}/qpdf-${QPDF_VERSION}.tar.gz"
          checksums="${RUNNER_TEMP}/qpdf-${QPDF_VERSION}.sha256"
          source_dir="${RUNNER_TEMP}/qpdf-${QPDF_VERSION}"
          build_dir="${RUNNER_TEMP}/qpdf-${QPDF_VERSION}-build"
          install_dir="${RUNNER_TEMP}/qpdf-${QPDF_VERSION}-install"

          curl --fail --location --retry 3 --output "${archive}" \
            "${release_url}/qpdf-${QPDF_VERSION}.tar.gz"
          curl --fail --location --retry 3 --output "${checksums}" \
            "${release_url}/qpdf-${QPDF_VERSION}.sha256"
          expected="$(awk -v archive="qpdf-${QPDF_VERSION}.tar.gz" '$2 == archive { print $1; exit }' "${checksums}")"
          actual="$(shasum -a 256 "${archive}" | awk '{ print $1 }')"
          test -n "${expected}"
          test "${actual}" = "${expected}"

          brew install cmake pkg-config
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          export PKG_CONFIG_PATH="$(brew --prefix jpeg-turbo)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
          cmake -S "${source_dir}" -B "${build_dir}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${install_dir}" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix jpeg-turbo);$(brew --prefix openssl@3);$(brew --prefix zlib)" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_STATIC_LIBS=ON \
            -DREQUIRE_CRYPTO_OPENSSL=ON
          cmake --build "${build_dir}" --parallel 2
          cmake --install "${build_dir}"

      - name: Add qpdf 11.9.0 to PATH (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' "${RUNNER_TEMP}/qpdf-${QPDF_VERSION}-install/bin" >> "${GITHUB_PATH}"

      - name: Install qpdf 11.9.0 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseUrl = "https://github.com/qpdf/qpdf/releases/download/v$env:QPDF_VERSION"
          $archive = Join-Path $env:RUNNER_TEMP "qpdf-$env:QPDF_VERSION-mingw64.zip"
          $checksums = Join-Path $env:RUNNER_TEMP "qpdf-$env:QPDF_VERSION.sha256"
          $installDir = Join-Path $env:RUNNER_TEMP "qpdf-$env:QPDF_VERSION"

          Invoke-WebRequest -Uri "$releaseUrl/qpdf-$env:QPDF_VERSION-mingw64.zip" -OutFile $archive
          Invoke-WebRequest -Uri "$releaseUrl/qpdf-$env:QPDF_VERSION.sha256" -OutFile $checksums
          $checksumLine = @(Select-String -Path $checksums -Pattern ([regex]::Escape("qpdf-$env:QPDF_VERSION-mingw64.zip") + '$'))
          if ($checksumLine.Count -ne 1) {
            throw "unable to locate the qpdf 11.9.0 Windows archive checksum"
          }
          $expected = ($checksumLine.Line -split '\s+')[0]
          $actual = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash
          if ($actual -ne $expected) {
            throw "qpdf 11.9.0 Windows archive checksum mismatch"
          }

          Expand-Archive -Path $archive -DestinationPath $installDir
          $qpdf = @(Get-ChildItem -Path $installDir -Filter qpdf.exe -File -Recurse)
          if ($qpdf.Count -ne 1) {
            throw "expected exactly one qpdf.exe in the qpdf 11.9.0 archive"
          }
          $qpdf[0].DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify qpdf 11.9.0 oracle
        shell: bash
        run: |
          set -euo pipefail

          qpdf --version
          test "$(qpdf --version | sed -n '1p' | tr -d '\r')" = "qpdf version ${QPDF_VERSION}"

      # Windows-only, and it saves nothing by itself: the same work is split
      # into two steps so Actions times the compile and the run separately.
      # Windows is the matrix cell that gates this workflow's wall clock (job
      # 333s against 257s for the next slowest), and reconstructing where that
      # time goes currently means diffing timestamps inside cargo's own output
      # in the job log — on the run measured, ~246s compiling and linking the
      # 162 test binaries against ~37s actually running tests and ~10s of
      # doctests.
      #
      # `--all-targets` implies `--tests`, which covers the lib/bin unittest
      # targets too, so the step below recompiles nothing and its duration is
      # the run cost alone (verified locally: a cold `cargo build --workspace
      # --all-targets` leaves `cargo test --workspace --no-run` with zero
      # `Compiling` lines). Spelling it `cargo build` rather than `cargo test
      # --no-run` also keeps the single-invocation contract in
      # crates/flpdf-cli/tests/ci_workflow_contract.rs literally true.
      - name: Build test binaries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          cargo build --workspace --all-targets

      - name: Run workspace test suite
        shell: bash
        run: |
          set -euo pipefail

          echo "[ci] cargo test --workspace"
          cargo test --workspace

      # amd64-Linux-only: the captured reference bytes match the amd64 Ubuntu
      # base image's zlib1g version; Windows (libz-sys vendored zlib),
      # ubuntu-24.04-arm (different arch base image) and macOS would produce
      # spurious diffs.
      - name: bytes-identical zlib compat (Linux amd64)
        if: ${{ runner.os == 'Linux' && matrix.arch == 'amd64' }}
        run: |
          set -euo pipefail
          # Pins flate2's deflate backend to classic libz.
          cargo test -p flpdf --features qpdf-zlib-compat --test zlib_compat_tests
          # Demonstrates plain --static-id rewrite is cmp-diff-0 vs qpdf golden.
          cargo test -p flpdf --features qpdf-zlib-compat --test cmp_diff_zero_tests
          # Pins qpdf's null-object visibility rules in plain full rewrites.
          cargo test -p flpdf --features qpdf-zlib-compat --test cmp_null_visibility_tests
          # Pins --deterministic-id /ID byte-parity vs qpdf (two-level MD5,
          # /Info seed, NUL truncation, and non-16-byte /ID[0] preservation).
          cargo test -p flpdf --features qpdf-zlib-compat --test deterministic_id_qpdf_parity_tests
          # Pins NON-linearized --object-streams=generate byte-parity vs qpdf
          # goldens (incl. the orphaned-/Length-holder drop, flpdf-sqkq).
          cargo test -p flpdf --features qpdf-zlib-compat --test cmp_generate_objstm_tests
          # Pins linearized output structural byte-parity vs qpdf golden
          # (everything except the qpdf-internal /ID[1]; see flpdf-wb76).
          cargo test -p flpdf --features qpdf-zlib-compat --test cmp_linearize_tests
          # Pins linearized --object-streams=generate byte-parity vs qpdf goldens
          # (structural + strict, incl. the in_open_document openaction oracles
          # and the multi-container OD ordering discriminator flpdf-699x).
          cargo test -p flpdf --features qpdf-zlib-compat --test cmp_linearize_objstm_tests
          # Pins overlay/underlay output byte-identity vs committed qpdf goldens.
          # These gates live in lib unit tests (overlay::byte_gate) behind the
          # qpdf-zlib-compat cfg, so they must be run explicitly with --lib.
          cargo test -p flpdf --features qpdf-zlib-compat --lib overlay::byte_gate
          # Pins the CLI binary's linearized output byte-identity vs qpdf goldens
          # end-to-end (argument parsing -> WriteOptions -> write path -> framing).
          # Gated behind qpdf-zlib-compat, so it is compiled out of the default
          # test workflow and must be run explicitly here.
          cargo test -p flpdf-cli --features qpdf-zlib-compat --test cli_byte_identical
          # Pins the CLI binary's overlay/underlay output byte-identity vs qpdf
          # goldens end-to-end (raw-argv pre-split -> WriteOptions -> write path).
          # Gated behind qpdf-zlib-compat; must be run explicitly here.
          cargo test -p flpdf-cli --features qpdf-zlib-compat --test cli_byte_identical_overlay
          # Pins AES-128 (V=4/AESV2) --encrypt output byte-identity vs qpdf,
          # both non-linearized (encrypted_document_is_byte_identical_to_qpdf)
          # and linearized (cli_linearize_encrypt_aes128_byte_identical_to_qpdf,
          # flpdf-txag). Gated behind qpdf-zlib-compat (DEFLATE backend); the
          # plain `cargo test` step above runs this same file under default
          # features, where those two tests are compiled out.
          cargo test -p flpdf-cli --features qpdf-zlib-compat --test encrypt_cli_tests
          # Pins the `flpdf rewrite --static-id` baseline snapshot vs qpdf
          # goldens. Gated behind qpdf-zlib-compat so the golden reflects
          # true qpdf byte-parity; under the default miniz backend the test
          # is compiled out (the one sanctioned byte deviation).
          cargo test -p flpdf-cli --features qpdf-zlib-compat --test compat_baseline_static_id -- --nocapture
          # Pins the per-flag matrix snapshot (byte-equal / qpdf-json /
          # structural verdicts) vs qpdf goldens. Same rationale as the
          # static-id baseline above: gated behind qpdf-zlib-compat so the
          # flpdf-sha and byte-equal columns record qpdf byte-parity, not
          # miniz drift.
          cargo test -p flpdf-cli --features qpdf-zlib-compat --test compat_matrix_baseline -- --nocapture
          # flpdf-qtest-tools' flate-compression-tolerance e2e is gated
          # behind qpdf-zlib-compat (mirrors the flpdf-cli byte-identical
          # tests above); the default `cargo test` above cfgs it out.
          cargo test -p flpdf-qtest-tools --features qpdf-zlib-compat --test e2e

  coverage:
    name: Coverage
    needs: quality
    runs-on: ubuntu-latest
    # Codecov OIDC upload needs id-token: write.  Isolating coverage in its
    # own single-runner job keeps that elevated permission off the cross-
    # platform `test` matrix cells (least privilege).  Job-level permissions
    # fully replace the workflow-level set, so contents: read is restated.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so scripts/patch-coverage.sh can find git merge-base
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.97.1

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3
        with:
          shared-key: ubuntu-latest-flpdf-cov

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@88ada01c46e65c47040a0ae865537cc76fcd0e1c # cargo-llvm-cov

      # qpdf oracle hard-fails on Linux CI when missing (skip_if_qpdf_missing),
      # and cargo llvm-cov --workspace exercises those suites — install it.
      - name: Install qpdf
        run: bash scripts/ci-apt-install.sh qpdf

      # Output to target/ (gitignored) so the working tree stays clean for the
      # patch-coverage gate's dirty-tree check.
      #
      # `--features qpdf-zlib-compat` mirrors scripts/patch-coverage.sh's fresh-
      # mode default: the byte-identical `overlay::byte_gate` tests are gated on
      # that feature, and without it coverage under-reports catastrophically
      # (600+ false-positive uncovered lines on flpdf-9hc.34). `--ignore-run-fail`
      # lets a single pre-existing baseline miss (flpdf-hdsz on
      # attachment-two-page.pdf) not block the coverage gate — the gate is the
      # changed-line diff, and the `test` matrix job runs the full suite with a
      # proper pass/fail gate separately.
      - name: Run tests with coverage
        run: cargo llvm-cov --workspace --features qpdf-zlib-compat --ignore-run-fail --lcov --output-path target/patch-cov.lcov

      # Authoritative changed-line coverage gate: 100% for crates/flpdf/src/,
      # report-only for crates/flpdf-cli/src/.  Understands // cov:ignore markers
      # for genuinely-untestable defensive branches; Codecov upload below is for
      # visibility only (codecov/patch is informational per codecov.yml). Use the
      # actual PR base so each stacked PR gates its own layer; main pushes fall
      # back to origin/main.
      - name: Patch coverage gate
        run: scripts/patch-coverage.sh --base "origin/${{ github.base_ref || 'main' }}" --lcov target/patch-cov.lcov

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov
          path: target/patch-cov.lcov
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: target/patch-cov.lcov
          use_oidc: true
          fail_ci_if_error: false

  fuzz:
    name: Fuzz (short)
    needs: quality
    runs-on: ubuntu-latest
    # Backstop in case `cargo fuzz build` hangs or -max_total_time is not
    # honored; the run itself should finish in a few minutes (build + 60s).
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # cargo-fuzz needs nightly (libFuzzer / -Zsanitizer=address). Pin a known-
      # good nightly rather than floating `nightly` so a bad nightly can't break
      # unrelated PRs through this blocking gate.
      - name: Set up Rust (pinned nightly)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: nightly-2026-05-24
          components: rust-src

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3
        with:
          shared-key: ubuntu-latest-flpdf-fuzz
          workspaces: fuzz

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@88ada01c46e65c47040a0ae865537cc76fcd0e1c # cargo-fuzz
        with:
          tool: cargo-fuzz

      # Short whole-document fuzz. -timeout=10 makes the "traversal terminates"
      # guarantee testable (libFuzzer's default per-input timeout is 1200s, which
      # would let a single hang silently eat the whole time budget). A crash,
      # abort, OOM, or hang writes an artifact and exits non-zero, failing CI.
      #
      # --target is pinned to the gnu triple: cargo-fuzz defaults its build
      # target to the triple it was itself compiled for, and cargo-binstall
      # fetches the musl build of cargo-fuzz, which would otherwise build for
      # musl. musl is statically-linked libc (incompatible with
      # -Zsanitizer=address) and its std/ASan runtime isn't installed. The gnu
      # target ships the prebuilt sanitizer runtime with the host nightly.
      - name: Short fuzz (roundtrip, 60s)
        run: |
          set -euo pipefail
          mkdir -p fuzz/corpus/roundtrip
          cargo fuzz run --target x86_64-unknown-linux-gnu roundtrip \
            fuzz/corpus/roundtrip fuzz/seeds/roundtrip \
            -- -max_total_time=60 -timeout=10 -rss_limit_mb=2048
