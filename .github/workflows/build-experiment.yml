# TEMPORARY probe, not part of the CI contract. Delete this file once the
# experiment concludes; its result belongs in `Cargo.toml`, not here.
#
# Question: how much of the Windows build cost is debug-info generation?
# With the build/test split in place the phases are timed separately, and the
# first run measured 272s building against 51s running. The workspace declares
# no `[profile.*]` at all, so every one of the 162 test binaries gets a full
# PDB from MSVC.
#
# Why `[profile.dev]` and not `[profile.test]`: `cargo build --all-targets`
# uses `dev` while `cargo test` uses `test`, which inherits `dev`. Identical
# settings let the two share artifacts — that is exactly why the build step
# feeds the test step with zero recompilation. Diverging `[profile.test]`
# forks the whole graph instead (measured: `CARGO_PROFILE_TEST_DEBUG=0` with
# `cargo test --no-run` recompiled 94 crates), which would break the split and
# pay for two full builds. So the variants here move `dev`.
#
# This lives in its own workflow rather than as extra cells on `ci.yml`'s test
# matrix because that matrix is pinned to exactly four entries by
# `crates/flpdf-cli/tests/ci_workflow_contract.rs`.
name: Build experiment

on:
  pull_request:
    paths:
      - .github/workflows/build-experiment.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows-build:
    name: Windows build (dev debug = ${{ matrix.label }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: full (current default)
            dev_debug: "true"
          - label: line-tables-only
            dev_debug: line-tables-only
          - label: none
            dev_debug: "0"

    env:
      CARGO_PROFILE_DEV_DEBUG: ${{ matrix.dev_debug }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      # Read-only on purpose. A cell that saved a `target/` built under a
      # non-default profile to the shared key would poison every later run of
      # the real workflow, main included.
      - name: Restore cargo cache
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3
        with:
          shared-key: windows-latest-flpdf
          save-if: false

      # Builds the dependency graph under this cell's profile, so the measured
      # step below pays only for the workspace crates and their test binaries
      # — which is precisely what rust-cache leaves every real CI run to pay
      # (it caches dependencies but not workspace crates).
      - name: Warm dependencies under this profile
        shell: bash
        run: cargo build --workspace --all-targets

      - name: Clean workspace crates
        shell: bash
        run: |
          set -euo pipefail

          before="$(find target/debug/deps -type f | wc -l)"
          cargo clean -p flpdf -p flpdf-cli -p flpdf-qtest-tools -p flpdf-libjpeg-compat
          after="$(find target/debug/deps -type f | wc -l)"

          echo "[experiment] deps/ files: ${before} -> ${after}"
          # A renamed package would make `cargo clean -p` a silent no-op and
          # the measurement below would time an already-complete build.
          test "${after}" -lt "${before}"

      # This step's duration is the measurement.
      - name: Measure workspace build
        shell: bash
        run: cargo build --workspace --all-targets

      # The variant is only usable if it preserves the property the split
      # depends on: the dev-profile build must still satisfy `cargo test`.
      - name: Verify the build step still feeds the test step
        shell: bash
        run: |
          set -euo pipefail

          compiling="$(cargo test --workspace --no-run 2>&1 | grep -c 'Compiling' || true)"
          echo "[experiment] Compiling lines in cargo test --no-run: ${compiling}"
          test "${compiling}" -eq 0

      # The number is only half the decision: dropping debug info costs
      # backtrace quality, and on MSVC that means no PDB to resolve frames
      # against. Run a real `should_panic` unit test with the panic hook
      # printing, so the trade-off is measured on an actual test binary of
      # this workspace rather than argued from first principles.
      - name: Backtrace quality under this profile
        shell: bash
        run: |
          set -uo pipefail

          echo "[experiment] backtrace for a should_panic unit test:"
          cargo test -p flpdf --lib \
            cache::tests::source_free_xref_entry_is_unreachable_during_cache_construction \
            -- --exact --nocapture 2>&1 | head -40

      - name: Report artifact size
        shell: bash
        run: |
          set -euo pipefail

          echo "[experiment] target/debug/deps total: $(du -sh target/debug/deps | cut -f1)"
